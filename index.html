<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0;
        box-sizing: border-box;}
        .main{
            width: 100%;
            height: 100vh;
            background-image: url(background-img.jpeg);
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-form{
            height: 500px;
            width: 350px;
           background-color: rgba(240, 248, 255, 0.74);
           display: flex;
           flex-direction: column;
           justify-content:space-around;
           border-radius: 20px;
        }
        .heading{
            margin:40px;
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 30px;
        }
        .inputs{
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            border:none;
        }
        button{
            background-color: rgb(30, 83, 8);
            padding: 15px;
            margin: 15px;
        }
        .checkbox{
            margin: 20px;
        }
      span{
        margin: 20px;
      }
        .fpass{
            text-decoration: none;
            color: blue;
            margin-left: 40px;
        }
    </style>
</head>
<body>
   <div class="main">
<form class="login-form">
    <h1 class="heading">Account login</h1>

    <input type="text" placeholder="User Name" class="inputs">
    <input type="password" placeholder="Password" class="inputs">
    <button>LOGIN</button>
    <div class="checkbox">
        <span><input type="checkbox">
        <label >remember me </label></span>
         <a href="#" class="fpass">forgot password?</a>
        </div>
        
    
       
     
</form>
   </div>
</body>
</html>
